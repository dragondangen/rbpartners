server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ---------- Security headers ----------
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy    "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Hide nginx version
    server_tokens off;

    # ---------- Hard block: never serve executable/legacy code ----------
    # Even though no PHP exists in this project, deny by extension as defense-in-depth.
    location ~* \.(php|phtml|php5|php7|pl|py|cgi|asp|aspx|sh|exe)$ {
        deny all;
        return 404;
    }

    # Deny hidden/sensitive files
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # ---------- Caching strategy ----------
    # Build assets carry a content hash in the filename -> cache hard.
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Theme stylesheets have stable names -> must always revalidate so updates
    # are picked up immediately (no stale immutable cache).
    location ^~ /theme/ {
        expires -1;            # Cache-Control: no-cache
        try_files $uri =404;
    }

    # Media: stable paths, moderate cache.
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # The HTML shell must always revalidate.
    location = /index.html {
        expires -1;            # Cache-Control: no-cache
    }

    # ---------- SPA fallback ----------
    location / {
        expires -1;            # Cache-Control: no-cache for app routes
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
