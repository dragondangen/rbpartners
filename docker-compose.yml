services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: rbpartners-react:latest
    container_name: rbpartners_web
    ports:
      - "8080:80"
    restart: unless-stopped
    # Hardening
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
